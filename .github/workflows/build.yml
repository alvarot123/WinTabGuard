name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WinTabGuard.sln

      - name: Build
        run: dotnet build WinTabGuard.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src\WinTabGuard\WinTabGuard.csproj --configuration Release --runtime win-x64 --output artifacts\publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinTabGuard-win-x64
          path: artifacts\publish\
